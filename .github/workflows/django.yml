name: Django CI - PostgreSQL & SQLite Testing

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        database: ["postgresql", "sqlite"]

    services:
      postgresql:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3  # Changed from v4 to v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4  # Changed from v5 to v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libpq-dev \
          build-essential \
          pkg-config \
          gettext

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install psycopg2-binary flake8 coverage dj-database-url

    - name: Create .env.dev file
      run: |
        cat > .env.dev << EOF
        SECRET_KEY=test-secret-key-not-for-production
        DEBUG=True
        ALLOWED_HOSTS=localhost,127.0.0.1,testserver
        APP_ENV=test
        EOF

    - name: Configure database
      run: |
        if [ "${{ matrix.database }}" = "postgresql" ]; then
          echo "DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_db" >> .env.dev
        else
          echo "DATABASE_URL=sqlite:///db.sqlite3" >> .env.dev
        fi

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 apps/ --count --select=E9,F63,F7,F82 --show-source --statistics || true

    - name: Run Django checks
      run: |
        python manage.py check

    - name: Run tests
      env:
        DJANGO_ENV: test
        SECRET_KEY: test-secret-key-not-for-production
      run: |
        python manage.py test apps/ --verbosity=3 --noinput

    - name: Run tests with coverage
      run: |
        pip install coverage
        coverage run manage.py test apps/
        coverage report
