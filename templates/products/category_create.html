{% extends 'base.html' %}

{% block title %}Create Category - Sidoos Plasco Shop{% endblock %}

{% block content %}
<div class="container">
    <h1>Create Category</h1>
    <p><a href="{% url 'products:category_list' %}">Back to categories</a></p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create</button>
    </form>
</div>
{% endblock %}
