<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<style>
    :root{
      --charcoal:#111111;
      --graphite:#1c1c1c;
      --emerald:#123c36;
      --cream:#f5f0e8;
      --beige:#d8cfc1;
      --gold:#b89b5e;
      --gold-soft: rgba(184,155,94,.35);
      --cream-soft: rgba(245,240,232,.6);
      --ease: cubic-bezier(.16,.84,.44,1);
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{
      background:var(--charcoal);
      color:var(--cream);
      font-family:'Vazirmatn', sans-serif;
      overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
    }
    ::selection{background:var(--gold);color:var(--charcoal);}
    a{color:inherit;text-decoration:none;}
    img{max-width:100%;display:block;}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
    .eyebrow{
      font-family:'Cormorant Garamond', serif;
      font-style:italic;
      letter-spacing:.04em;
      color:var(--gold);
      font-size:15px;
      display:inline-flex;
      align-items:center;
      gap:10px;
    }
    .eyebrow::before{
      content:'';
      width:26px;height:1px;background:var(--gold);
      display:inline-block;
    }
    .latin{
      font-family:'Cormorant Garamond', serif;
      letter-spacing:.42em;
      text-transform:uppercase;
      font-weight:400;
    }
    .container{
      max-width:1280px;
      margin:0 auto;
      padding:0 6vw;
    }
    h1,h2,h3{font-weight:700;letter-spacing:-.01em;}

    /* ===== particle canvas ===== */
    #particles{
      position:fixed;
      inset:0;
      width:100%;height:100%;
      z-index:0;
      pointer-events:none;
      opacity:.9;
    }

    /* ===== scroll reveal ===== */
    .reveal{
      opacity:0;
      transform:translateY(36px);
      transition:opacity 1s var(--ease), transform 1.1s var(--ease);
    }
    .reveal.in{opacity:1;transform:translateY(0);}
    .reveal-delay-1{transition-delay:.1s;}
    .reveal-delay-2{transition-delay:.22s;}
    .reveal-delay-3{transition-delay:.34s;}

    /* ===== NAVBAR ===== */
    header{
      position:fixed;top:0;right:0;left:0;
      z-index:100;
      display:flex;align-items:center;justify-content:space-between;
      padding:26px 6vw;
      transition:padding .5s var(--ease), background .5s var(--ease), backdrop-filter .5s var(--ease), border-color .5s var(--ease);
      border-bottom:1px solid transparent;
    }
    header.scrolled{
      padding:16px 6vw;
      background:rgba(17,17,17,.78);
      backdrop-filter:blur(14px) saturate(140%);
      border-bottom:1px solid rgba(184,155,94,.16);
    }
    .logo{
      display:flex;flex-direction:column;align-items:center;gap:2px;
      line-height:1;
    }
    .logo .fa{font-size:23px;font-weight:800;letter-spacing:.02em;}
    .logo .en{font-size:9px;color:var(--gold);}
    nav.primary{
      display:flex;gap:44px;
      font-size:14.5px;
      letter-spacing:.01em;
    }
    nav.primary a{
      position:relative;
      color:var(--cream-soft);
      transition:color .35s;
      padding:4px 0;
    }
    nav.primary a::after{
      content:'';
      position:absolute;bottom:0;right:0;left:auto;
      width:0;height:1px;background:var(--gold);
      transition:width .4s var(--ease);
    }
    nav.primary a:hover{color:var(--cream);}
    nav.primary a:hover::after{width:100%;}
    .nav-actions{display:flex;align-items:center;gap:22px;}
    .icon-btn{
      width:20px;height:20px;position:relative;
      color:var(--cream);
      opacity:.85;transition:opacity .3s, transform .3s;
    }
    .icon-btn:hover{opacity:1;transform:translateY(-1px);}
    .icon-btn svg{width:100%;height:100%;}
    .cart-dot{
      position:absolute;top:-6px;left:-7px;
      width:14px;height:14px;border-radius:50%;
      background:var(--gold);color:var(--charcoal);
      font-size:9px;display:flex;align-items:center;justify-content:center;
      font-weight:700;
    }
    .burger{
      display:none;flex-direction:column;gap:5px;width:24px;
    }
    .burger span{height:1px;background:var(--cream);display:block;}

    /* ===== HERO ===== */
    .hero{
      position:relative;
      height:100vh;
      min-height:640px;
      overflow:hidden;
      display:flex;align-items:center;
    }
    .hero-slide{
      position:absolute;inset:0;
      display:flex;align-items:center;
      opacity:0;
      transition:opacity 1.4s var(--ease);
      pointer-events:none;
    }
    .hero-slide.active{opacity:1;pointer-events:auto;}
    .hero-bg{
      position:absolute;inset:0;
      background-size:cover;background-position:center;
      transform:scale(1.12);
      transition:transform 8s linear;
      filter:saturate(.9) brightness(.62);
    }
    .hero-slide.active .hero-bg{transform:scale(1);}
    .hero-bg::after{
      content:'';position:absolute;inset:0;
      background:linear-gradient(90deg, rgba(17,17,17,.92) 0%, rgba(17,17,17,.62) 42%, rgba(17,17,17,.28) 75%, rgba(17,17,17,.55) 100%);
    }
    .hero-content{
      position:relative;z-index:2;
      max-width:640px;
      margin-right:6vw;
      margin-left:auto;
    }
    .hero-slide .eyebrow{margin-bottom:22px;}
    .hero-title{
      font-size:clamp(40px, 5.6vw, 76px);
      line-height:1.16;
      font-weight:800;
      margin-bottom:22px;
      opacity:0;transform:translateY(26px);
      transition:opacity 1s var(--ease) .3s, transform 1s var(--ease) .3s;
    }
    .hero-slide.active .hero-title{opacity:1;transform:translateY(0);}
    .hero-sub{
      font-size:16.5px;
      color:var(--cream-soft);
      line-height:1.9;
      max-width:460px;
      margin-bottom:38px;
      opacity:0;transform:translateY(20px);
      transition:opacity 1s var(--ease) .5s, transform 1s var(--ease) .5s;
    }
    .hero-slide.active .hero-sub{opacity:1;transform:translateY(0);}
    .hero-cta-wrap{
      opacity:0;transform:translateY(16px);
      transition:opacity 1s var(--ease) .7s, transform 1s var(--ease) .7s;
      display:flex;gap:18px;align-items:center;
    }
    .hero-slide.active .hero-cta-wrap{opacity:1;transform:translateY(0);}

    .btn-gold{
      display:inline-flex;align-items:center;gap:12px;
      background:var(--gold);
      color:var(--charcoal);
      padding:16px 34px;
      font-size:14px;letter-spacing:.02em;font-weight:700;
      border:1px solid var(--gold);
      transition:background .4s var(--ease), color .4s var(--ease), letter-spacing .4s;
      position:relative;overflow:hidden;
    }
    .btn-gold:hover{letter-spacing:.06em;}
    .btn-ghost{
      display:inline-flex;align-items:center;gap:10px;
      color:var(--cream);
      padding:16px 8px;
      font-size:14px;
      border-bottom:1px solid rgba(245,240,232,.35);
      transition:border-color .3s, gap .3s;
    }
    .btn-ghost:hover{border-color:var(--gold);gap:14px;}

    .hero-nav{
      position:absolute;bottom:46px;right:6vw;z-index:3;
      display:flex;align-items:center;gap:22px;
    }
    .hero-dots{display:flex;gap:12px;}
    .hero-dot{
      width:34px;height:2px;background:rgba(245,240,232,.28);
      position:relative;overflow:hidden;
    }
    .hero-dot i{
      position:absolute;inset:0;width:0;background:var(--gold);
    }
    .hero-dot.active i{width:100%;transition:width 6s linear;}
    .hero-count{
      font-family:'Cormorant Garamond',serif;
      font-size:14px;color:var(--beige);letter-spacing:.05em;
    }
    .hero-arrows{position:absolute;bottom:46px;left:6vw;z-index:3;display:flex;gap:14px;}
    .arrow-btn{
      width:44px;height:44px;border:1px solid rgba(245,240,232,.24);
      display:flex;align-items:center;justify-content:center;
      transition:border-color .3s, background .3s;
    }
    .arrow-btn:hover{border-color:var(--gold);background:rgba(184,155,94,.1);}
    .arrow-btn svg{width:16px;height:16px;}

    .scroll-cue{
      position:absolute;bottom:46px;left:50%;transform:translateX(-50%);
      z-index:3;display:flex;flex-direction:column;align-items:center;gap:10px;
      color:var(--beige);font-size:11px;letter-spacing:.15em;
    }
    .scroll-cue .line{width:1px;height:38px;background:linear-gradient(var(--gold), transparent);animation:scrollcue 2.4s ease-in-out infinite;}
    @keyframes scrollcue{0%{transform:scaleY(0);transform-origin:top;}50%{transform:scaleY(1);transform-origin:top;}51%{transform-origin:bottom;}100%{transform:scaleY(0);transform-origin:bottom;}}

    /* ===== SIGNATURE VASE MOTIF ===== */
    .vase-motif{
      position:absolute; opacity:.5; pointer-events:none;
    }
    .vase-motif svg{width:100%;height:100%;}
    .vase-motif path{
      fill:none; stroke:var(--gold); stroke-width:1;
    }
    .spin-slow{animation:spin 90s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* ===== SECTION generic ===== */
    section{position:relative;z-index:1;}
    .section-pad{padding:130px 0;}
    .section-head{
      display:flex;justify-content:space-between;align-items:flex-end;
      margin-bottom:70px;gap:30px;flex-wrap:wrap;
    }
    .section-title{
      font-size:clamp(28px,3.4vw,44px);
      margin-top:14px;
    }
    .section-desc{
      max-width:360px;color:var(--cream-soft);
      font-size:14.5px;line-height:1.95;
    }
    .divider{
      width:100%;height:1px;
      background:linear-gradient(90deg, transparent, rgba(184,155,94,.5), transparent);
    }

    /* ===== WHY SIDOOS ===== */
    .why{background:var(--graphite);}
    .why-grid{
      display:grid;grid-template-columns:repeat(4,1fr);
      gap:0;border-top:1px solid rgba(216,207,193,.12);
    }
    .why-item{
      padding:46px 30px;
      border-left:1px solid rgba(216,207,193,.12);
      transition:background .5s var(--ease);
      position:relative;
    }
    .why-item:hover{background:rgba(184,155,94,.05);}
    .why-num{
      font-family:'Cormorant Garamond',serif;font-style:italic;
      color:var(--gold);font-size:15px;margin-bottom:26px;display:block;
    }
    .why-icon{width:34px;height:34px;margin-bottom:24px;color:var(--gold);}
    .why-icon svg{width:100%;height:100%;}
    .why-item h3{font-size:19px;margin-bottom:12px;}
    .why-item p{font-size:13.6px;color:var(--cream-soft);line-height:1.9;}

    /* ===== CATEGORIES ===== */
    .cat-grid{
      display:grid;
      grid-template-columns:1.3fr 1fr 1fr;
      grid-template-rows:260px 260px;
      gap:14px;
    }
    .cat-card{
      position:relative;overflow:hidden;
      background-size:cover;background-position:center;
      display:flex;align-items:flex-end;padding:30px;
    }
    .cat-card::before{
      content:'';position:absolute;inset:0;
      background:linear-gradient(to top, rgba(17,17,17,.88) 0%, rgba(17,17,17,.15) 55%, transparent 100%);
      transition:background .5s;
    }
    .cat-card:nth-child(1){grid-row:span 2;}
    .cat-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease);}
    .cat-card:hover img{transform:scale(1.08);}
    .cat-inner{position:relative;z-index:2;width:100%;}
    .cat-count{font-size:11.5px;color:var(--beige);letter-spacing:.05em;margin-bottom:6px;display:block;}
    .cat-inner h3{font-size:22px;margin-bottom:12px;}
    .cat-link{
      font-size:12.5px;color:var(--gold);display:inline-flex;align-items:center;gap:8px;
      opacity:0;transform:translateY(8px);
      transition:opacity .4s, transform .4s;
    }
    .cat-card:hover .cat-link{opacity:1;transform:translateY(0);}

    /* ===== BESTSELLERS ===== */
    .best{background:var(--charcoal);}
    .scroller{
      display:flex;gap:22px;overflow-x:auto;padding-bottom:20px;
      scroll-snap-type:x proximity;
      scrollbar-width:none;
    }
    .scroller::-webkit-scrollbar{display:none;}
    .product-card{
      flex:0 0 300px;scroll-snap-align:start;
      background:var(--graphite);
      border:1px solid rgba(216,207,193,.1);
      transition:border-color .4s, transform .5s var(--ease);
    }
    .product-card:hover{border-color:var(--gold-soft);transform:translateY(-6px);}
    .product-media{
      position:relative;height:340px;overflow:hidden;
      background:#141814;
    }
    .product-media img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease);}
    .product-card:hover .product-media img{transform:scale(1.07);}
    .product-badge{
      position:absolute;top:16px;right:16px;
      background:var(--emerald);color:var(--cream);
      font-size:11px;padding:6px 12px;letter-spacing:.03em;
    }
    .product-quick{
      position:absolute;bottom:0;right:0;left:0;
      display:flex;justify-content:center;
      padding:14px;background:rgba(17,17,17,.7);backdrop-filter:blur(6px);
      transform:translateY(100%);
      transition:transform .45s var(--ease);
      font-size:12.5px;letter-spacing:.03em;
    }
    .product-card:hover .product-quick{transform:translateY(0);}
    .product-info{padding:22px 22px 26px;}
    .product-cat{font-size:11.5px;color:var(--gold);margin-bottom:8px;display:block;}
    .product-info h4{font-size:16.5px;margin-bottom:10px;font-weight:600;}
    .product-price-row{display:flex;justify-content:space-between;align-items:center;}
    .price{font-size:15px;font-weight:700;}
    .price .old{
      color:var(--cream-soft);text-decoration:line-through;
      font-weight:400;font-size:12.5px;margin-inline-start:8px;
    }
    .add-btn{
      width:38px;height:38px;border:1px solid var(--gold-soft);
      display:flex;align-items:center;justify-content:center;
      transition:background .3s, transform .3s;
    }
    .add-btn:hover{background:var(--gold);color:var(--charcoal);transform:rotate(90deg);}
    .add-btn svg{width:14px;height:14px;}

    /* ===== OFFERS ===== */
    .offers{
      background:var(--emerald);
      position:relative;overflow:hidden;
    }
    .offers::before{
      content:'';position:absolute;inset:0;
      background:radial-gradient(circle at 85% 20%, rgba(184,155,94,.16), transparent 55%);
    }
    .offer-grid{
      display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;position:relative;z-index:2;
    }
    .offer-text .eyebrow{color:var(--gold);}
    .offer-text h2{font-size:clamp(30px,4vw,50px);margin:20px 0 24px;}
    .offer-text p{color:var(--beige);line-height:2;max-width:420px;margin-bottom:36px;font-size:15px;}
    .countdown{display:flex;gap:14px;margin-bottom:38px;}
    .cd-box{
      width:70px;height:70px;border:1px solid rgba(184,155,94,.35);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:rgba(17,17,17,.25);
    }
    .cd-box b{font-size:22px;font-family:'Cormorant Garamond',serif;}
    .cd-box span{font-size:10px;color:var(--beige);margin-top:4px;}
    .offer-visual{
      position:relative;height:420px;
    }
    .offer-visual img{width:100%;height:100%;object-fit:cover;}
    .offer-tag{
      position:absolute;top:24px;left:24px;
      background:var(--gold);color:var(--charcoal);
      padding:14px 20px;font-weight:800;font-size:20px;
      line-height:1;
    }
    .offer-tag span{display:block;font-size:10px;font-weight:600;margin-top:4px;}

    /* ===== ABOUT ===== */
    .about-grid{
      display:grid;grid-template-columns:.9fr 1.1fr;gap:80px;align-items:center;
    }
    .about-media{position:relative;height:520px;}
    .about-media img{width:100%;height:100%;object-fit:cover;}
    .about-media .frame{
      position:absolute;inset:-18px auto auto -18px;
      width:100%;height:100%;border:1px solid var(--gold-soft);
      z-index:-1;
    }
    .about-text .eyebrow{margin-bottom:20px;}
    .about-text h2{font-size:clamp(30px,3.8vw,46px);line-height:1.35;margin-bottom:26px;}
    .about-text p{color:var(--cream-soft);line-height:2.05;font-size:15px;margin-bottom:20px;max-width:520px;}
    .about-stats{display:flex;gap:50px;margin-top:44px;padding-top:36px;border-top:1px solid rgba(216,207,193,.15);}
    .about-stats div b{font-family:'Cormorant Garamond',serif;font-size:36px;color:var(--gold);display:block;}
    .about-stats div span{font-size:12.5px;color:var(--cream-soft);}

    /* ===== TESTIMONIALS ===== */
    .testi{background:var(--graphite);}
    .testi-track-wrap{overflow:hidden;}
    .testi-track{display:flex;transition:transform .8s var(--ease);}
    .testi-slide{flex:0 0 100%;display:flex;justify-content:center;text-align:center;}
    .testi-slide blockquote{
      max-width:680px;font-family:'Cormorant Garamond',serif;
      font-size:clamp(22px,2.6vw,32px);font-weight:400;line-height:1.7;
      color:var(--cream);
    }
    .testi-slide .stars{color:var(--gold);letter-spacing:6px;margin-bottom:26px;font-size:16px;}
    .testi-name{margin-top:30px;font-size:14px;color:var(--gold);}
    .testi-role{font-size:12px;color:var(--cream-soft);margin-top:4px;}
    .testi-dots{display:flex;justify-content:center;gap:10px;margin-top:50px;}
    .testi-dots button{width:8px;height:8px;border-radius:50%;background:rgba(216,207,193,.3);transition:background .3s, transform .3s;}
    .testi-dots button.active{background:var(--gold);transform:scale(1.3);}

    /* ===== NEWSLETTER STRIP ===== */
    .news-strip{
      background:var(--cream);color:var(--charcoal);
      padding:80px 0;
    }
    .news-inner{display:flex;justify-content:space-between;align-items:center;gap:40px;flex-wrap:wrap;}
    .news-inner h3{font-size:clamp(24px,3vw,34px);max-width:480px;line-height:1.4;}
    .news-form{display:flex;gap:0;border-bottom:1px solid var(--charcoal);padding-bottom:12px;min-width:340px;}
    .news-form input{
      flex:1;background:none;border:none;font-family:inherit;font-size:14px;color:var(--charcoal);
      outline:none;
    }
    .news-form input::placeholder{color:rgba(17,17,17,.5);}
    .news-form button{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--emerald);white-space:nowrap;}

    /* ===== FOOTER ===== */
    footer{background:var(--charcoal);padding:100px 0 0;position:relative;}
    .footer-grid{
      display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:50px;
      padding-bottom:80px;border-bottom:1px solid rgba(216,207,193,.1);
    }
    .footer-brand p{color:var(--cream-soft);font-size:13.6px;line-height:2;margin-top:22px;max-width:280px;}
    .footer-col h5{font-size:13px;letter-spacing:.03em;color:var(--gold);margin-bottom:22px;font-weight:600;}
    .footer-col ul{list-style:none;display:flex;flex-direction:column;gap:14px;}
    .footer-col a{font-size:13.6px;color:var(--cream-soft);transition:color .3s, padding-right .3s;}
    .footer-col a:hover{color:var(--cream);padding-right:6px;}
    .footer-social{display:flex;gap:12px;margin-top:24px;}
    .footer-social a{
      width:36px;height:36px;border:1px solid rgba(216,207,193,.2);
      display:flex;align-items:center;justify-content:center;
      transition:border-color .3s, background .3s;
    }
    .footer-social a:hover{border-color:var(--gold);background:rgba(184,155,94,.1);}
    .footer-social svg{width:14px;height:14px;}
    .footer-bottom{
      display:flex;justify-content:space-between;align-items:center;
      padding:30px 0 40px;font-size:12px;color:var(--cream-soft);flex-wrap:wrap;gap:14px;
    }
    .footer-bottom .latin{font-size:11px;}

    /* ===== back to top ===== */
    .totop{
      position:fixed;bottom:30px;left:30px;z-index:60;
      width:48px;height:48px;border:1px solid var(--gold-soft);
      background:rgba(17,17,17,.7);backdrop-filter:blur(8px);
      display:flex;align-items:center;justify-content:center;
      opacity:0;pointer-events:none;transform:translateY(10px);
      transition:opacity .4s, transform .4s;
    }
    .totop.show{opacity:1;pointer-events:auto;transform:translateY(0);}
    .totop svg{width:16px;height:16px;}

    @media(max-width:1100px){
      .why-grid{grid-template-columns:repeat(2,1fr);}
      .cat-grid{grid-template-columns:1fr 1fr;grid-template-rows:220px 220px 220px;}
      .cat-card:nth-child(1){grid-row:span 1;grid-column:span 2;}
      .about-grid,.offer-grid{grid-template-columns:1fr;}
      .about-media{height:380px;order:2;}
      .footer-grid{grid-template-columns:1fr 1fr;}
    }
    @media(max-width:760px){
      nav.primary{display:none;}
      .burger{display:flex;}
      .hero-content{margin-right:6vw;max-width:90%;}
      .hero-arrows{display:none;}
      .why-grid{grid-template-columns:1fr;}
      .why-item{border-left:none;border-bottom:1px solid rgba(216,207,193,.12);}
      .cat-grid{grid-template-columns:1fr;grid-template-rows:auto;}
      .cat-card:nth-child(1){grid-column:span 1;}
      .cat-card{height:280px;}
      .footer-grid{grid-template-columns:1fr;gap:36px;}
      .news-inner{flex-direction:column;align-items:flex-start;}
